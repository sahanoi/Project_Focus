services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: focus_ftp
      POSTGRES_PASSWORD: focus_ftp_local
      POSTGRES_DB: focus_ftp
    volumes:
      - focus_ftp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U focus_ftp -d focus_ftp']
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  focus_ftp_pgdata:
